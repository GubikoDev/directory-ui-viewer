name: 문제 제보
description: 설치 또는 폴더 탐색 중 발생한 문제를 알려주세요.
body:
  - type: markdown
    attributes:
      value: 실제 폴더 경로와 파일명은 예시 이름으로 바꿔 주세요. 스크린샷을 첨부할 때도 개인 정보가 보이는지 확인해 주세요.
  - type: input
    id: version
    attributes:
      label: 앱 버전 또는 소스 커밋
      placeholder: 예) 0.1.0 또는 git rev-parse --short HEAD 결과
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 버전 및 Mac 칩
      placeholder: 예) macOS 26.0, Apple M4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 어떤 보기에서 어떤 버튼을 눌렀는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 동작과 실제 결과
      description: 오류 메시지가 있었다면 함께 적어 주세요.
    validations:
      required: true
